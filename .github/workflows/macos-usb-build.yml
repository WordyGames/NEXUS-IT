name: Compilar NEXUS IT para Mac USB

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/macos-usb-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-usb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-usb:
    name: Generar app macOS para USB
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos del escritorio
        run: npm run typecheck --workspace=apps/desktop
        # Hay errores de tipos heredados en servicios compartidos ajenos al empaquetado.
        # Se conserva el chequeo visible, pero el build nativo es la validación decisiva.
        continue-on-error: true

      - name: Generar icono de macOS
        run: |
          ICONSET="apps/desktop/assets/NEXUS-IT.iconset"
          SOURCE="apps/mobile/assets/icon.png"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128 256 512; do
            sips -z "$SIZE" "$SIZE" "$SOURCE" --out "$ICONSET/icon_${SIZE}x${SIZE}.png"
            DOUBLE_SIZE=$((SIZE * 2))
            sips -z "$DOUBLE_SIZE" "$DOUBLE_SIZE" "$SOURCE" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o apps/desktop/assets/icon.icns

      - name: Crear paquete USB para Mac
        run: npm run dist:mac:usb --workspace=apps/desktop

      - name: Publicar descarga de la app
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-IT-Mac-USB
          path: apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30
